; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
    esp32c3supermini
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps = https://github.com/cwi-dis/iotsa.git#develop
build_flags =

; The deployed meter (iotsa_v4 == ESP8266 nodemcuv2). 4m1m ldscript: 1MB app /
; 1MB OTA scratch / 2MB LittleFS. This app keeps nothing in the filesystem, so
; the 3MB FS of the default 4m3m layout is wasted -- and 4m3m has no OTA slot at
; all. Matches the nodemcuv2 choice in iotsaNeoClock / iotsaDoorOpener.
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld

; In development: a C3 super-mini meant to run off the P1 port's own power, no
; external PSU -- see iotsaSmartMeter#1. iotsa's [esp32c3supermini] board-def
; already carries the native-USB CDC flags, esp32c3 mcu, 4MB flash and
; min_spiffs partitions; only the app feature flags are added here.
[env:esp32c3supermini]
extends = esp32c3supermini
build_flags = ${_esp32c3_nativeusb.build_flags} -DIOTSA_WITH_HTTPS -DIOTSA_WITH_BLE
